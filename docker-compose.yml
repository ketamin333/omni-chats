services:

  app:
    container_name: app
    user: "1000:1000"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis

  worker:
    container_name: worker
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: always

  reverb:
    container_name: reverb
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"
    restart: always

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  node:
    container_name: node
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

volumes:
  pg_data:
  redis_data:
